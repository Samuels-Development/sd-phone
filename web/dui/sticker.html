<!doctype html>
<!--
  Photo sticker page (see client/cases.lua). Drawn off screen into the texture of a phone case's photo
  sticker: the picture named by ?src= as a small instant print, white border all the way round and a
  deeper one underneath. The whole square is painted, so the texture needs no transparency.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f4f2ec; }
  .print { position: absolute; inset: 0; box-sizing: border-box; padding: 7% 7% 20% 7%; background: #f4f2ec; }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; background: #d9d6cf; }
</style>
</head>
<body>
<div class="print"><img id="p" alt="" /></div>
<script>
(() => {
  'use strict';
  const src = new URLSearchParams(location.search).get('src') || '';
  if (/^https:\/\//i.test(src)) document.getElementById('p').src = src;
})();
</script>
</body>
</html>
