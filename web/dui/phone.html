<!doctype html>
<!--
  Prop screen DUI page (optional feature, see client/propscreen.lua and configs/phone.lua PropScreen).
  Boots the unmodified web/build bundle (the asset list is read from web/build/index.html, so a rebuild
  needs no edit here) and fits the phone's screen element to this viewport, so the DUI texture is
  exactly the phone screen. Served as https://cfx-nui-<resource>/..., which makes the bundle detect
  NUI mode and send its callbacks to https://<resource>/<action> like the NUI frame does.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="../build/" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000 !important; }
  /* sd-tone (below) undoes the game's tone mapping, so the UI is not shown faded */
  #root { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: url(#sd-tone); }
  /* the glass: a thin dark edge, so the picture sits in the phone and not on it */
  #glass { position: fixed; inset: 0; pointer-events: none; z-index: 2147483647;
    box-shadow: inset 0 0 0.9vw 0.25vw rgba(0, 0, 0, 0.5); }
  .sd-propscreen-hide { display: none !important; }
  /* the text cursor of the field being typed into (drawn here: a windowless browser shows none) */
  #caret { position: fixed; display: none; pointer-events: none; z-index: 2147483646; border-radius: 1px;
    animation: sd-caret 1.06s steps(1) infinite; }
  @keyframes sd-caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
</style>
<script>
(() => {
  'use strict';
  const RES = location.hostname.replace(/^cfx-nui-/, '') || 'sd-phone';
  const post = (action, body) => fetch(`https://${RES}/${action}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(body || {}),
  }).catch(() => {});
  const state = { active: false, debug: false };

  // ---- audio gate: the NUI frame owns sound unless the prop session is up (no double ringtones)
  const gains = new Set();
  const applyGain = () => { for (const g of gains) { try { g.gain.value = state.active ? 1 : 0; } catch (_) {} } };
  const RealAC = window.AudioContext || window.webkitAudioContext;
  if (RealAC) {
    const destGet = Object.getOwnPropertyDescriptor(BaseAudioContext.prototype, 'destination').get;
    class GatedAC extends RealAC {
      constructor(...a) { super(...a); const g = this.createGain(); g.connect(destGet.call(this)); this.__g = g; gains.add(g); applyGain(); }
      get destination() { return this.__g || destGet.call(this); }
    }
    window.AudioContext = GatedAC; window.webkitAudioContext = GatedAC;
  }
  const realPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function (...a) {
    if (!state.active) this.muted = true; else if (this.__psMuted) this.muted = false;
    this.__psMuted = !state.active;
    return realPlay.apply(this, a);
  };

  // ---- fit: map the phone's screen element onto the whole viewport
  let s = { sx: 1, sy: 1, tx: 0, ty: 0 };
  function screenEl() {
    // the phone screen: the largest clipped rounded rect inside the shell (440x956 CSS px shut)
    let best = null, area = 0;
    for (const el of document.querySelectorAll('#root div[style*="clip-path"]')) {
      const r = el.getBoundingClientRect();
      const a = r.width * r.height;
      if (a > area && r.height > r.width * 0.9) { best = el; area = a; }
    }
    return best;
  }
  // The shell draws the frame and the screen's cutout (the island, a notch or a punch hole) in one svg over
  // the screen. The prop has its own frame, so the frame parts are hidden; the cutout has to stay, as the
  // picture replaces the prop's own screen texture, the island painted on it included. The cutout is the
  // svg's black shape, and whatever lies inside its box (its collar and lenses) belongs to it.
  let bezelKey = '';
  function dressBezel(svg) {
    const kids = [...svg.children].filter((c) => c.tagName.toLowerCase() !== 'defs');
    const cut = kids.find((c) => c.getAttribute('fill') === '#000' && /^(rect|path)$/i.test(c.tagName));
    const key = kids.length + '|' + (cut ? (cut.getAttribute('d') || ['x', 'y', 'width', 'height'].map((a) => cut.getAttribute(a)).join(',')) : '');
    if (key === bezelKey && kids.every((c) => c.dataset.sdBezel)) return;
    bezelKey = key;
    for (const c of kids) c.classList.remove('sd-propscreen-hide');
    let box = null;
    try { box = cut ? cut.getBBox() : null; } catch (_) {}
    for (const c of kids) {
      let keep = false;
      if (box && box.width > 0) {
        try {
          const b = c.getBBox(), pad = 14;
          keep = b.width > 0 && b.x >= box.x - pad && b.y >= box.y - pad && b.x + b.width <= box.x + box.width + pad && b.y + b.height <= box.y + box.height + pad;
        } catch (_) {}
      }
      c.dataset.sdBezel = keep ? 'keep' : 'hide';
      c.classList.toggle('sd-propscreen-hide', !keep);
    }
  }
  function fit() {
    const root = document.getElementById('root');
    const el = screenEl();
    if (!root || !el) return;
    for (const c of el.parentElement.children) if (c.tagName.toLowerCase() === 'svg') dressBezel(c);
    const r = el.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    // undo our current transform to get the layout rect, then fit it to the viewport
    const nx = (r.left - s.tx) / s.sx, ny = (r.top - s.ty) / s.sy, nw = r.width / s.sx, nh = r.height / s.sy;
    const W = window.innerWidth, H = window.innerHeight;
    let sx = W / nw, sy = H / nh, ox = 0, oy = 0;
    // A screen whose aspect is far from the viewport's (an unfolded foldable) is letterboxed
    // instead of stretched; a near match fills the viewport exactly.
    if (Math.abs(sx / sy - 1) > 0.08) {
      const k = Math.min(sx, sy); sx = sy = k;
      ox = (W - nw * k) / 2; oy = (H - nh * k) / 2;
    }
    const n = { sx, sy, tx: ox - nx * sx, ty: oy - ny * sy };
    if (Math.abs(n.sx - s.sx) > 1e-4 || Math.abs(n.sy - s.sy) > 1e-4 || Math.abs(n.tx - s.tx) > 0.5 || Math.abs(n.ty - s.ty) > 0.5) {
      s = n;
      root.style.transform = `matrix(${s.sx},0,0,${s.sy},${s.tx},${s.ty})`;
    }
  }
  setInterval(fit, 200);
  window.addEventListener('resize', fit);

  // ---- text entry through the game's on-screen keyboard
  let editing = null;
  const isText = (el) => el && ((el.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|color|file)$/i.test(el.type)) || el.tagName === 'TEXTAREA') && !el.readOnly && !el.disabled;
  // A windowless DUI browser never has OS focus, so focus events are unreliable: a tap (pointerup) on
  // a text field is the trigger, focusin the backup for fields the UI focuses itself.
  const askText = (el) => {
    if (!state.active || !isText(el) || editing === el) return;
    editing = el;
    try { el.focus(); } catch (_) {}
    caret = (el.value || '').length;
    showCaret();
    post('sd-phone:propscreen:text', {});
  };
  // Leaving the field: a tap on anything that is not a text field, Escape, or the session ending.
  const leaveText = () => {
    if (!editing) return;
    const el = editing; editing = null;
    try { el.blur(); } catch (_) {}
    showCaret();
    post('sd-phone:propscreen:blur', {});
  };
  // ---- typing: keys arrive from the NUI frame by way of Lua and are applied to the field here
  let caret = 0;
  const bar = document.createElement('div');
  bar.id = 'caret';
  // A windowless browser draws no text cursor of its own, so one is drawn: the field's text up to the
  // caret is measured in the field's own font and the bar set at the end of it.
  const measure = document.createElement('canvas').getContext('2d');
  function showCaret() {
    const el = editing;
    if (!el || !el.isConnected) { bar.style.display = 'none'; return; }
    if (!bar.isConnected) document.body.appendChild(bar);
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    const scale = r.width / (el.offsetWidth || r.width);
    const size = parseFloat(cs.fontSize) * scale;
    measure.font = `${cs.fontStyle} ${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    const shown = el.type === 'password' ? '\u2022'.repeat(caret) : (el.value || '').slice(0, caret);
    const line = el.tagName === 'TEXTAREA' ? shown.slice(shown.lastIndexOf('\n') + 1) : shown;
    const row = el.tagName === 'TEXTAREA' ? shown.split('\n').length - 1 : 0;
    const pad = parseFloat(cs.paddingLeft) * scale, top = parseFloat(cs.paddingTop) * scale;
    const lh = (parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.25) * scale;
    const centred = cs.textAlign === 'center' ? (r.width - measure.measureText(el.value || '').width) / 2 - pad : 0;
    const x = Math.min(r.right - 2, r.left + pad + Math.max(0, centred) + measure.measureText(line).width - el.scrollLeft * scale);
    const y = el.tagName === 'TEXTAREA' ? r.top + top + row * lh - el.scrollTop * scale : r.top + (r.height - lh) / 2;
    bar.style.cssText = `display:block;left:${x}px;top:${y}px;height:${lh}px;width:${Math.max(1.5, size * 0.09)}px;background:${cs.caretColor && cs.caretColor !== 'auto' ? cs.caretColor : cs.color}`;
  }
  setInterval(() => { if (editing && !editing.isConnected) leaveText(); else if (editing) showCaret(); }, 250);
  function typeKey(d) {
    const el = editing;
    if (!el) return;
    if (!el.isConnected) { leaveText(); return; }
    let v = el.value || '';
    caret = Math.max(0, Math.min(caret, v.length));
    const max = el.maxLength > 0 ? el.maxLength : 100000;
    const put = (text) => {
      const room = Math.max(0, max - v.length);
      const add = (el.tagName === 'TEXTAREA' ? text : text.replace(/[\r\n]+/g, ' ')).slice(0, room);
      if (!add) return;
      v = v.slice(0, caret) + add + v.slice(caret); caret += add.length; setValue(el, v);
    };
    if (typeof d.text === 'string') { put(d.text); showCaret(); return; }
    const k = d.key;
    if (k === 'Escape') { leaveText(); return; }
    if (k === 'Enter') {
      if (el.tagName === 'TEXTAREA' && d.shift) put('\n');
      else {
        for (const type of ['keydown', 'keypress', 'keyup']) el.dispatchEvent(new KeyboardEvent(type, { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true }));
        if (el.form && el.form.requestSubmit) { try { el.form.requestSubmit(); } catch (_) {} }
        caret = (el.value || '').length;
      }
    } else if (k === 'Backspace') {
      if (d.ctrl) { const cut = v.slice(0, caret).replace(/\S*\s*$/, ''); v = cut + v.slice(caret); caret = cut.length; setValue(el, v); }
      else if (caret > 0) { v = v.slice(0, caret - 1) + v.slice(caret); caret -= 1; setValue(el, v); }
    } else if (k === 'Delete') {
      if (caret < v.length) { v = v.slice(0, caret) + v.slice(caret + 1); setValue(el, v); }
    } else if (k === 'ArrowLeft') caret = Math.max(0, caret - 1);
    else if (k === 'ArrowRight') caret = Math.min(v.length, caret + 1);
    else if (k === 'Home') caret = 0;
    else if (k === 'End') caret = v.length;
    else if (k === 'Tab') { leaveText(); return; }
    else if (d.ctrl && k.toLowerCase() === 'a') caret = v.length;
    else if (k.length === 1 && !d.ctrl) put(k);
    try { el.setSelectionRange(caret, caret); } catch (_) {}
    showCaret();
  }
  const fieldAt = (t) => {
    if (!t || !t.closest) return t;
    const own = t.closest('input,textarea');
    if (own) return own;
    // a tap on a search pill / field wrapper (small box holding one text field) edits that field
    const inner = t.querySelectorAll ? t.querySelectorAll('input,textarea') : [];
    if (inner.length === 1 && t.getBoundingClientRect().height < 90) return inner[0];
    return t;
  };
  document.addEventListener('pointerup', (e) => {
    const el = fieldAt(e.target);
    if (isText(el)) { if (el !== editing) { editing = null; askText(el); } }
    else leaveText();
  }, true);
  document.addEventListener('focusin', (e) => askText(e.target), true);
  document.addEventListener('pointerdown', (e) => {
    if (!state.debug) return;
    const t = e.target;
    post('sd-phone:propscreen:log', { x: e.clientX, y: e.clientY, tag: t.tagName, cls: String(t.className || '').slice(0, 60), text: (t.textContent || '').trim().slice(0, 30) });
  }, true);
  function setValue(el, value) {
    const proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, value);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function key(k) {
    const t = document.activeElement || document.body;
    for (const type of ['keydown', 'keyup']) t.dispatchEvent(new KeyboardEvent(type, { key: k, code: k, bubbles: true, cancelable: true }));
  }

  // ---- Lua -> page control messages ride the same message channel as the app's pushes
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || !d.propScreen) return;
    if (d.propScreen === 'type') {
      typeKey(d);
    } else if (d.propScreen === 'active') {
      state.active = !!d.on; state.debug = !!d.debug; applyGain();
      if (!d.on) leaveText();
    } else if (d.propScreen === 'text') {
      const el = editing; editing = null;
      if (el && !d.cancelled && typeof d.value === 'string') setValue(el, d.value);
      if (el) el.blur();
    } else if (d.propScreen === 'key') {
      key(d.key);
    } else if (d.propScreen === 'gain') {
      const v = Math.max(0.1, Math.min(1, +d.value || 1));
      document.getElementById('root').style.filter = `url(#sd-tone) brightness(${v})`;
    }
  });

  // ---- boot the bundle from index.html
  (async () => {
    const html = await (await fetch('index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const el of doc.head.querySelectorAll('link[rel="stylesheet"], link[rel="modulepreload"], script[type="module"]')) {
      const n = document.createElement(el.tagName.toLowerCase());
      for (const a of el.attributes) n.setAttribute(a.name, a.value);
      document.head.appendChild(n);
    }
    // ready once React has painted something into #root
    const t0 = Date.now();
    const iv = setInterval(() => {
      const root = document.getElementById('root');
      if ((root && root.childElementCount > 0) || Date.now() - t0 > 15000) {
        clearInterval(iv);
        fit();
        post('sd-phone:propscreen:ready', { w: window.innerWidth, h: window.innerHeight, mounted: !!(root && root.childElementCount) });
      }
    }, 100);
  })();
})();
</script>
</head>
<body>
<!--
  The game tone-maps the screen like any lit surface: measured on the prop, a 25% grey comes out at 35%,
  a 50% grey at 56%, and white at 80%, which flattens the whole UI. This curve is the inverse of that
  measurement (17 points, 0 to 255 in steps of 16), so a grey lands where it was meant to, under the same
  white. Measure again with a grey ramp as the screen texture if the phone's screen material changes.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sd-tone" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0 .019 .051 .086 .123 .165 .207 .256 .305 .362 .419 .488 .558 .653 .747 .873 1" />
      <feFuncG type="table" tableValues="0 .019 .051 .086 .123 .165 .207 .256 .305 .362 .419 .488 .558 .653 .747 .873 1" />
      <feFuncB type="table" tableValues="0 .019 .051 .086 .123 .165 .207 .256 .305 .362 .419 .488 .558 .653 .747 .873 1" />
    </feComponentTransfer>
  </filter>
</svg>
<div id="root"></div>
<div id="glass"></div>
</body>
</html>
